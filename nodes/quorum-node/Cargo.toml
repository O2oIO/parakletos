[package]
name = "quorum-node"
version = "0.1.0"
edition = "2021"

[dependencies]
anchor-lang = "0.30.1"
solana-sdk = "1.18.26"
switchboard-on-demand = "0.11.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
bs58 = "0.5"
dotenv = "0.15"

# Parakletos program types
parakletos-program = { path = "../../programs/parakletos_program", features = ["cpi"] }
